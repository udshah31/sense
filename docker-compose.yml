# SENSE service containers.
# Model weights are never baked into images — mount a host cache volume instead.
# Image digests, not tags, are pinned once each service has a Dockerfile (Phase 0: none yet).

services:
  neural:
    build: ./services/neural
    env_file: .env
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
    # GPU access (Phase 0 placeholder — uncomment on the GPU environment):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  orchestrator:
    build: ./services/orchestrator
    depends_on:
      - neural
      - symbolic

  symbolic:
    build: ./services/symbolic
    ports:
      - "8001:8001"
