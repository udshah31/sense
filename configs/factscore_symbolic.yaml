# FActScore symbolic-verification pipeline check (experiments/factscore_symbolic_verification.py).
#
# Not an RQ1-RQ3 harness — it exercises the decomposition-front-end -> Z3
# round-trip (CLAUDE.md's design decisions) against FActScore's biography-prompt
# entities, since this project has no free-text-to-triple extractor yet
# (documented in configs/rq3.yaml's symbolic_probe, same reason it applies here).
# Verification checks a known ground-truth probe claim built from the Z3 backend's
# own fixed domain KB (services/symbolic/src/sense_symbolic/domain.py) for any
# FActScore entity that resolves against it — most won't, and are recorded as
# abstained rather than guessed at. This validates the pipeline mechanics, not the
# generated biography's factual content.
model: cpu_test        # key into configs/model.yaml, same model as RQ1-RQ3
eval_split: test
n_eval_examples: 200    # full committed test split (data/splits/factscore.json)
decoding:
  do_sample: false
  max_new_tokens: 20
