# nli_verdict_short_answer (HaluEval-shaped harnesses): entailment probability
# at or above which a generated answer counts as entailing right_answer or
# hallucinated_answer. Calibrated 2026-08-20
# (experiments/calibrate_nli_short_answer_threshold.py) against HaluEval's own
# right_answer/hallucinated_answer construction as ground truth — 0.7 scored
# 98.7%/98.2% verdict-accuracy on the fit/held-out calibration-pool split (see
# results/nli_short_answer_calibration.json). Honest limitation of that
# calibration: it uses the canonical answer text as a stand-in generation
# (self-entailment), not a real paraphrased model output — see eval/README.md.
# 2026-10-06: the judge now prefixes the question to both premise and hypothesis
# (sense_eval.nli_judge.short_answer_nli_pair); the value below was fit on the earlier
# bare-text formulation. The calibration was re-run for the new formulation
# (results/nli_short_answer_calibration.json): the interior optimum on the canonical-
# answer stand-in is 0.97 (95.0% fit / 95.9% held out; 0.98 -> 92.9%, 0.99 -> 67.4%),
# versus 98.7% at 0.7 for the old formulation. It is deliberately NOT applied: real
# generations that contain the right answer scored a median entailment of ~0.93 in the
# 30-example diagnostic, so a 0.97 threshold would send most of them back to "unknown".
# The stand-in objective (shared question text inflates BOTH answers' entailment) no
# longer matches real output. 0.7 stays provisional pending a calibration against real,
# labeled generations or a margin-based verdict (decision recorded in the PR).
# 2026-10-07: the short-answer verdict is now BINARY — "incorrect" means "not
# demonstrably correct", and "unknown" is gone from this judge (the tri-state rule
# labeled ~77% of a real sample "unknown"). The threshold is still the provisional 0.7;
# experiments/dump_labeling_sample.py produces real generations to label and refit it.
short_answer_entailment_threshold: 0.7

# factscore_style_verdict (FActScore-shaped harness): per-claim entailment
# threshold for "this atomic claim is supported by the reference text" ...
# Calibrated 2026-08-26 (experiments/calibrate_factscore_thresholds.py)
# against the original FActScore paper's own 183-entity human-annotated set
# (InstructGPT/ChatGPT/PerplexityAI generations, real human S/NS/IR labels —
# see sense_data.factscore_labeled) — FActScore has no free known-right/
# known-wrong pair the way HaluEval does, so this reuses real human labels
# for different models' outputs instead of a self-entailment proxy. 0.02
# scored 80.7% claim-level verdict accuracy fit/held-out on real S/NS labels
# (results/factscore_threshold_calibration.json) — a genuine interior peak
# in the swept range (0.0 -> 68.2%, 0.02 -> 79.5%, declining monotonically
# above that), not a boundary artifact; the low absolute value reflects this
# small NLI model's entailment-class probabilities running compressed toward
# 0 on short single-sentence premises, not near-random discrimination (false
# positive/negative rates are both ~17-27%, well off a degenerate always-S
# predictor). Honest limitations: 2026 Wikipedia reference-text snapshot vs.
# the 2023-vintage text the human annotators actually verified against, and
# the judged generations are InstructGPT/ChatGPT/PerplexityAI (2023), not any
# of this project's five checkpoints — real progress over an arbitrary
# spot-check value, not a substitute for calibrating against this project's
# own model outputs. See eval/README.md and the calibration script's
# docstring for the full limitation list.
claim_supported_threshold: 0.02
# ... and the two thresholds the resulting supported_fraction is discretized
# against — same calibration run, swept over a binarized
# human_supported_fraction ground truth (n=196 fit / 53 holdout examples).
# 0.09/0.0 sits on a genuine accuracy plateau (90.8% fit, 94.3% holdout,
# flat across fraction_incorrect_threshold in [0.0, 0.09] before declining
# above that) — not a runaway edge value, though the low absolute levels mean
# this discretization treats even modest partial support as "correct" and
# only a claim set with essentially no supported facts as "incorrect."
fraction_correct_threshold: 0.09
fraction_incorrect_threshold: 0.0
