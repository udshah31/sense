# RQ2 — does a self-adaptive threshold (recalibrated on the target model's own
# calibration data) preserve routing quality where a fixed (transferred) threshold
# does not?
#
# "Routing quality preserved" is operationalized (revised 2026-10-04, proposal-v5
# review issue C1) as DETECTION PERFORMANCE: does the gate fire on the examples the
# ungated model actually got wrong? Precision/recall/F1 of routed-vs-hallucinated,
# plus the threshold-free AUROC of the entropy signal itself. Labels come from
# HaluEval's own right_answer/hallucinated_answer pair, scored by the NLI judge.
# See eval/src/sense_eval/routing_quality.py.
#
# The previous operationalization — how close the held-out routing rate lands to the
# quantile's target rate (1 - quantile) — is retained as a SECONDARY diagnostic
# (`*_calibration_fidelity_gap`). It measures whether a threshold still behaves as
# calibrated, which is a real property, but it is not quality: a gate firing on
# exactly (1 - quantile) of examples chosen at random scores perfectly on it.
#
# Both entropy scales get a full condition. See configs/rq1.yaml's note on arms.
#
# Same five pairs as configs/rq1.yaml (cross-family anchors + Qwen3 scale ladder,
# CLAUDE.md's two transfer axes) — kept as a separate file since it's consumed by a
# separate harness, not because the content differs.
transfer_pairs:
  - {source_model: llama3, target_model: mistral}
  - {source_model: llama3, target_model: qwen3_8b}
  - {source_model: mistral, target_model: qwen3_8b}
  - {source_model: qwen3_8b, target_model: qwen3_4b}
  - {source_model: qwen3_8b, target_model: qwen3_1_7b}

eval_split: development

# Aggregator ablation (proposal §4.1, §5). The gate collapses a per-step entropy series
# to one number; `mean` over a fixed generation budget is the default and the simplest
# length-normalizing choice, but "simplest defensible" is not "verified best". Listing
# aggregators here adds one extra arm per scale per aggregator, recomputed from per-step
# entropies already recorded — no extra generation, no extra judge calls, only bootstrap
# resampling. Empty by default so the standard run is unchanged.
# Valid values: mean, max, last, p90.
aggregators: []
