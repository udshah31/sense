# RQ1 — does a fixed entropy-gating threshold, calibrated on one model, transfer to
# a model from a different family or a different scale? Both axes named in
# CLAUDE.md get tested: three cross-family anchors (llama3, mistral, qwen3_8b) and
# the Qwen3 scale ladder (qwen3_8b -> qwen3_4b -> qwen3_1_7b, largest-to-smallest —
# the direction a self-adaptive threshold would need to beat a fixed one on).
#
# Each entry is one directed source->target transfer run; the harness writes one
# result file per pair (rq1_transfer_halueval_<source>_to_<target>.json). This is
# five pairs, not the full 20-pair matrix across five checkpoints — deliberately
# contained scope (CLAUDE.md: "the symbolic backend can quietly become a research
# project of its own" applies just as much to blowing up the transfer matrix).
# Add reverse-direction pairs here if the advisor wants fuller coverage; don't add
# them silently.
transfer_pairs:
  - {source_model: llama3, target_model: mistral}
  - {source_model: llama3, target_model: qwen3_8b}
  - {source_model: mistral, target_model: qwen3_8b}
  - {source_model: qwen3_8b, target_model: qwen3_4b}
  - {source_model: qwen3_8b, target_model: qwen3_1_7b}

# Transfer is evaluated on the development split, never test — test is touched once,
# at the end, for the numbers that go in the paper (CLAUDE.md's data split discipline).
eval_split: development
# Optional: evaluate on a fixed prefix of the split (default: the whole split). Used to run the
# held-out test split at the same cost as development: n_eval_examples: 1000 with
# eval_split: test takes the first 1,000 of the committed test indices.
# n_eval_examples: 1000

# Each pair runs TWO transfer arms (added 2026-10-04, proposal-v5 review issue C3).
# Not configurable on purpose: both are always reported, because reporting only one
# is what made the earlier runs hard to interpret.
#
#   normalized — entropy / ln(vocab_size). Normalization is designed to remove the
#                cross-tokenizer incomparability that RQ1's premise rests on, and
#                quantile calibration removes what location difference is left, so
#                this arm asks whether a threshold transfers AFTER both sources of
#                non-transfer have been engineered out.
#   raw        — entropy in nats, transferred as a bare number on the native scale.
#                The naive thing a practitioner would do, and the arm the premise
#                predicts should fail.
#
# Reporting both separates "the signal doesn't transfer" from "normalization fixes
# it" — different findings, and the first retired-scope pilot
# (results/rq1_transfer_truthful_qa_llama3_to_mistral.json, agreement 1.0) could not
# distinguish them because only the normalized arm existed.

# Aggregator ablation (proposal §4.1, §5). The gate collapses a per-step entropy series
# to one number; `mean` over a fixed generation budget is the default and the simplest
# length-normalizing choice, but "simplest defensible" is not "verified best". Listing
# aggregators here adds one extra arm per scale per aggregator, recomputed from per-step
# entropies already recorded — no extra generation, no extra judge calls, only bootstrap
# resampling. Empty by default so the standard run is unchanged.
# Valid values: mean, max, last, p90.
aggregators: []
