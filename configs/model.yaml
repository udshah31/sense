# Model identity is config-driven — nothing hard-codes Llama-3 or Mistral (CLAUDE.md's
# CPU-testable rule). `active` selects which entry below is used; swap it to switch
# environments, never edit source to change model identity.
active: cpu_test

models:
  cpu_test:
    hf_repo: sshleifer/tiny-gpt2
    revision: 5f91d94bd9cd7190a9f3216ff93cd1dd95f2c7be
    quantization: none  # tiny model, fp32 — quantization scheme is irrelevant at this size

  # A second CPU-testable model from a different family (GPT-NeoX, not GPT-2), with a
  # different tokenizer and a much smaller vocab (1024 vs 50257). Exists so the RQ1
  # fixed-threshold-transfer harness (experiments/transfer_threshold_truthful_qa.py)
  # can be exercised on CPU: it stands in for "a model from a different family" the
  # same way llama3/mistral do on the GPU environment, exercising the raw-entropy-
  # isn't-comparable-across-tokenizers constraint (CLAUDE.md #4) without needing a GPU.
  cpu_test_transfer_target:
    hf_repo: hf-internal-testing/tiny-random-GPTNeoXForCausalLM
    revision: f417fcb49b46298ae7c01308ff33bfeadc104bd3
    quantization: none

  # GPU-environment entries — not runnable locally. Revisions must be pinned before
  # first use there, per CLAUDE.md's model-revision-pinning constraint.
  # Quantization: bf16 for both, per CLAUDE.md #2 (quantization held constant
  # across every model/condition). Chosen over int8/int4 because the entropy
  # gate reads raw next-token logits directly — aggressive quantization
  # perturbs that distribution, and this project's entire routing signal is
  # that distribution. bf16 halves fp32 memory with minimal logit distortion,
  # not zero, so entropy characterization runs should sanity-check that the
  # no-op/bounds correctness checks still hold under it before RQ1-RQ3 GPU runs.
  llama3:
    hf_repo: meta-llama/Meta-Llama-3-8B
    revision: 8cde5ca8380496c9a6cc7ef3a8b46a0372a1d920  # pinned 2026-07-28, main branch HEAD
    quantization: bf16

  mistral:
    hf_repo: mistralai/Mistral-7B-v0.1
    revision: 27d67f1b5f57dc0953326b2601d68371d40ea8da  # pinned 2026-07-28, main branch HEAD
    quantization: bf16
