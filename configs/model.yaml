# Model identity is config-driven — nothing hard-codes Llama-3 or Mistral (CLAUDE.md's
# CPU-testable rule). `active` selects which entry below is used; swap it to switch
# environments, never edit source to change model identity.
active: cpu_test

models:
  cpu_test:
    hf_repo: sshleifer/tiny-gpt2
    revision: 5f91d94bd9cd7190a9f3216ff93cd1dd95f2c7be
    quantization: none  # tiny model, fp32 — quantization scheme is irrelevant at this size

  # A second CPU-testable model from a different family (GPT-NeoX, not GPT-2), with a
  # different tokenizer and a much smaller vocab (1024 vs 50257). Exists so the RQ1
  # fixed-threshold-transfer harness (experiments/transfer_threshold_truthful_qa.py)
  # can be exercised on CPU: it stands in for "a model from a different family" the
  # same way llama3/mistral do on the GPU environment, exercising the raw-entropy-
  # isn't-comparable-across-tokenizers constraint (CLAUDE.md #4) without needing a GPU.
  cpu_test_transfer_target:
    hf_repo: hf-internal-testing/tiny-random-GPTNeoXForCausalLM
    revision: f417fcb49b46298ae7c01308ff33bfeadc104bd3
    quantization: none

  # GPU-environment entries — not runnable locally. Revisions must be pinned before
  # first use there, per CLAUDE.md's model-revision-pinning constraint.
  # Quantization: 4-bit (NF4) for all five, per CLAUDE.md #2 and the 2026-08-10 scope
  # reconciliation — supersedes the earlier bf16-only plan. Held constant across
  # every checkpoint because the entropy gate reads raw next-token logits directly;
  # aggressive quantization perturbs that distribution, and this project's entire
  # routing signal is that distribution. Not zero perturbation, so entropy
  # characterization runs should sanity-check that the no-op/bounds correctness
  # checks still hold under it before trusting RQ1-RQ3 GPU numbers.
  # Re-pinned 2026-08-16 to the Instruct variants CLAUDE.md's model table specifies
  # (Llama-3 8B Instruct, Mistral 7B Instruct v0.3) — the entries above this comment
  # had drifted to the base (non-instruction-tuned) checkpoints, a leftover from the
  # earlier two-model/TruthfulQA scope. Verified directly against the Hub API
  # (huggingface.co/api/models/<repo>) at pin time, not taken from a summary.
  llama3:
    hf_repo: meta-llama/Meta-Llama-3-8B-Instruct
    revision: 8afb486c1db24fe5011ec46dfbe5b5dccdb575c2  # pinned 2026-08-16, main branch HEAD; gated repo, requires HF_TOKEN
    quantization: 4bit

  mistral:
    hf_repo: mistralai/Mistral-7B-Instruct-v0.3
    revision: c170c708c41dac9275d15a8fff4eca08d52bab71  # pinned 2026-08-16, main branch HEAD
    quantization: 4bit

  # Qwen3 scale ladder + cross-family anchor (advisor-confirmed 2026-08-10 — "please
  # include the Qwen3 ladder", all three rungs kept). Qwen3 is a hybrid thinking/
  # non-thinking model family; `thinking_mode: false` is read by
  # experiments/_common.py's build_generation_inputs to force chat-template
  # generation with enable_thinking=False, per CLAUDE.md's "Qwen3 runs in
  # non-thinking mode throughout." Verified 2026-08-13 against the live Hub API:
  # all three repos exist, the pinned revisions match current main-branch HEAD, and
  # tokenizer.json/vocab.json/merges.txt have identical content hashes across all
  # three sizes — genuinely one shared tokenizer, not just same vocab size, which is
  # the stated reason Qwen3 was chosen as the scale ladder (CLAUDE.md #4).
  qwen3_8b:
    hf_repo: Qwen/Qwen3-8B
    revision: b968826d9c46dd6066d109eabc6255188de91218  # pinned 2026-08-11, main branch HEAD
    quantization: 4bit
    thinking_mode: false

  qwen3_4b:
    hf_repo: Qwen/Qwen3-4B
    revision: 1cfa9a7208912126459214e8b04321603b3df60c  # pinned 2026-08-11, main branch HEAD
    quantization: 4bit
    thinking_mode: false

  qwen3_1_7b:
    hf_repo: Qwen/Qwen3-1.7B
    revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e  # pinned 2026-08-11, main branch HEAD
    quantization: 4bit
    thinking_mode: false
