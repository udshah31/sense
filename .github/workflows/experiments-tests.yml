name: python tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: experiments
            dir: experiments
          - name: symbolic
            dir: services/symbolic
          - name: orchestrator
            dir: services/orchestrator
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync environment (CPU only)
        run: uv sync --group dev --python 3.13

      - name: Run ${{ matrix.name }} test suite
        run: uv run pytest -q
