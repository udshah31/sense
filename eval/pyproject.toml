[project]
name = "sense-eval"
version = "0.1.0"
description = "Metrics: factuality + latency."
requires-python = ">=3.13.5"
dependencies = []

[dependency-groups]
dev = [
    "pytest==8.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sense_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
