[project]
name = "sense-orchestrator"
version = "0.1.0"
description = "Gate policy, routing, symbolic interface, and instrumentation for SENSE."
requires-python = ">=3.13.5"
dependencies = [
    "sense-data",
]

[tool.uv.sources]
sense-data = { path = "../../data", editable = true }
sense-neural = { path = "../neural", editable = true }

[dependency-groups]
dev = [
    "pytest==8.3.5",
    # test-only: the orchestrator never imports sense-neural at runtime (it talks to
    # it over HTTP); this is here solely for the truncated-vs-exact entropy bounds
    # correctness test, which needs an in-process exact value as ground truth.
    "sense-neural",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sense_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
