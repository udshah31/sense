[project]
name = "sense-orchestrator"
version = "0.1.0"
description = "Gate policy, routing, symbolic interface, and instrumentation for SENSE."
requires-python = ">=3.13.5"
dependencies = [
    "sense-data",
]

[tool.uv.sources]
sense-data = { path = "../../data", editable = true }

[dependency-groups]
dev = [
    "pytest==8.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sense_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
