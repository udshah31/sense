[project]
name = "sense-neural"
version = "0.1.0"
description = "Entropy monitor, model loading, and probes for SENSE."
requires-python = ">=3.13.5"
dependencies = [
    "torch==2.7.0",
    "transformers==4.51.3",
    "numpy==2.2.4",
    "pyyaml==6.0.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sense_neural"]

[tool.pytest.ini_options]
testpaths = ["tests"]
