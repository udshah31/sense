[project]
name = "sense-neural"
version = "0.1.0"
description = "Entropy monitor, model loading, and probes for SENSE."
requires-python = ">=3.13.5"
dependencies = [
    "torch==2.7.0",
    "transformers==4.51.3",
    "numpy==2.2.4",
    "pyyaml==6.0.3",
    # bitsandbytes has no macOS wheels (CPU dev box) — Linux-only, matching the
    # "Llama-3/Mistral/Qwen3 GPU runs happen on the GPU environment only" rule.
    # CPU tests never reach the 4-bit BitsAndBytesConfig branch for real (they use
    # "none" quantization with tiny-gpt2), so this doesn't break CPU-testability.
    "bitsandbytes==0.45.3; sys_platform == 'linux'",
    "accelerate==1.6.0",
    # mistralai/Mistral-7B-Instruct-v0.3's tokenizer has no fast (tokenizer.json)
    # variant and falls back to the slow SentencePiece-based one, which raises
    # ValueError without this installed — found by actually loading Mistral on
    # the GPU environment, not by inspection; Llama-3/Qwen3 ship fast tokenizers
    # and never hit this path, which is why it went unnoticed until now.
    "sentencepiece==0.2.2",
    # sentencepiece's slow-tokenizer path above additionally needs protobuf
    # (transformers/convert_slow_tokenizer.py imports google.protobuf directly)
    # — same Mistral-only code path, same discovery route.
    "protobuf==7.36.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sense_neural"]

[tool.pytest.ini_options]
testpaths = ["tests"]
