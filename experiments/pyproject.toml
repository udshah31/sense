[project]
name = "sense-experiments"
version = "0.1.0"
description = "One script per table/figure in the paper."
requires-python = ">=3.13.5"
dependencies = [
    "sense-data",
    "sense-neural",
    "sense-orchestrator",
    "sense-symbolic",
    "sense-eval",
    "sense-rag",
    "pyyaml==6.0.2",
    "uvicorn==0.34.0",
]

[tool.uv.sources]
sense-data = { path = "../data", editable = true }
sense-neural = { path = "../services/neural", editable = true }
sense-orchestrator = { path = "../services/orchestrator", editable = true }
sense-symbolic = { path = "../services/symbolic", editable = true }
sense-eval = { path = "../eval", editable = true }
sense-rag = { path = "../services/rag", editable = true }

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
