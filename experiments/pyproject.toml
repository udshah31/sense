[project]
name = "sense-experiments"
version = "0.1.0"
description = "One script per table/figure in the paper."
requires-python = ">=3.13.5"
dependencies = [
    "sense-data",
    "sense-neural",
    "sense-orchestrator",
    "pyyaml==6.0.2",
]

[tool.uv.sources]
sense-data = { path = "../data", editable = true }
sense-neural = { path = "../services/neural", editable = true }
sense-orchestrator = { path = "../services/orchestrator", editable = true }

[dependency-groups]
dev = [
    "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
